# 未锁定时，有效的 X-Api-Proxy-Target 优先，把设置里的 API URL 作为上游。
# 锁定或未带头时仍转发到 API_PROXY_URL。
map $http_x_api_proxy_target $api_proxy_pass {
    default "${API_PROXY_URL}";
    "~*^https?://[^[:space:]]+" $http_x_api_proxy_target;
}

server {
    listen ${HOST}:${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 600m;
    add_header Referrer-Policy "unsafe-url" always;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # 静态资源长缓存（Vite 生成的带 hash 文件名）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 本地持久化生图任务，仅通过 web 容器同源访问。
    location /api/jobs/ {
        proxy_pass http://job-api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location /api/job-files/ {
        proxy_pass http://job-api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # BEGIN API PROXY
    # API 代理。前端请求同源 /api-proxy/...，由 Nginx 转发到部署时配置的 API_PROXY_URL。
    # 未锁定时也可按请求头 X-Api-Proxy-Target 转发到设置中填写的 API URL。
    # GET 用于模型列表，POST 用于生图/对话，OPTIONS 用于预检。
    location ~ ^/api-proxy/(?<api_proxy_suffix>.*)$ {
        # if/limit_except 可能清空正则捕获，先拷贝到普通变量。
        set $api_proxy_path $api_proxy_suffix;

        limit_except GET POST OPTIONS {
            deny all;
        }

        if ($uri = "/api-proxy/") {
            return 403 "Forbidden: API Proxy path required";
        }

        if ($api_proxy_pass = "") {
            return 502 "API Proxy target is not configured";
        }

        # 变量形式的 proxy_pass 需要 resolver。容器 DNS 再加一个公网兜底。
        resolver 127.0.0.11 1.1.1.1 valid=10s ipv6=off;

        proxy_pass $api_proxy_pass/$api_proxy_path$is_args$args;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Api-Proxy-Target "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    # END API PROXY

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
