name: Build and Publish Docker Image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize image owner (GHCR requires lowercase)
        id: image
        run: |
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "owner=${owner_lc}" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner_lc}/gpt_image_playground" >> "$GITHUB_OUTPUT"
          echo "job_api=ghcr.io/${owner_lc}/gpt_image_playground-job-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.web }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - id: meta-job-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.job_api }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      # GitHub Actions 有足够内存跑完整前端构建；服务器 512MB 只负责 pull 运行。
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push job-api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/job-api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-job-api.outputs.tags }}
          labels: ${{ steps.meta-job-api.outputs.labels }}
          cache-from: type=gha,scope=job-api
          cache-to: type=gha,mode=max,scope=job-api

      - name: Summary
        run: |
          {
            echo '## Docker images published'
            echo ''
            echo "- web: \`${{ steps.image.outputs.web }}\`"
            echo "- job-api: \`${{ steps.image.outputs.job_api }}\`"
            echo ''
            echo '### web tags'
            echo '```'
            echo '${{ steps.meta-web.outputs.tags }}'
            echo '```'
            echo '### job-api tags'
            echo '```'
            echo '${{ steps.meta-job-api.outputs.tags }}'
            echo '```'
            echo ''
            echo 'Low-memory server deploy:'
            echo '```bash'
            echo 'docker login ghcr.io -u USERNAME -p TOKEN'
            echo 'docker compose -f compose.prod.yaml pull'
            echo 'docker compose -f compose.prod.yaml up -d'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
